name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shellcheck and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck update.sh

      - name: Build image
        run: docker build -t garevans/zerotrust-ip-list-updater:1.2 -t garevans/zerotrust-ip-list-updater:latest .
